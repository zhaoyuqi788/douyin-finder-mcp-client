name: 安装、注册或使用问题
description: 由用户或 coding agent 提交可复现的问题，日志须脱敏。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先检索已有 Issue。这里也接受登录、注册和服务端问题；不必先判断责任组件。
        公开报告不得包含邀请码、密码、邮箱验证码、OAuth 令牌、个人账号或私人业务需求。
  - type: input
    id: client_version
    attributes:
      label: 客户端版本
      placeholder: 例如 0.4.7；不确定时填写未知
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: 操作系统、coding 软件及版本、Node.js 版本、发生时间与时区。
      placeholder: 不要粘贴包含其他连接器密钥的完整配置。
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 出现问题的步骤
      options:
        - 安装或配置注册
        - 注册、邮箱验证或邀请码兑换
        - 登录或令牌续期
        - 工具调用、会话重连或网络
        - 提人任务或结果
        - 其他或未知
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与已经尝试的排查
      description: 使用最小复现；任务需求和返回的私有数据请替换成合成示例。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与实际行为
      description: 写明错误码、HTTP 状态或 MCP 错误，以及能否稳定复现。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 仅保留诊断所需片段，移除令牌、Cookie、邀请码、邮箱、个人路径及业务数据。
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 已检索已有 Issue，且报告不包含邀请码、密码、验证码、令牌或私人业务信息。
          required: true
